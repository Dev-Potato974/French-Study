<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: a blue enamel street plate over a single working column; the test itself runs as one large card at a time. */
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --surface-2:#E3E9F2; --sel:#E4EDFB;
  --fg:#12203A; --muted:#55637C; --line:#C5CFDE;
  --plaque:#1D4F9C; --plaque-fg:#FFFFFF; --pick:#1D4F9C;
  --btn:#1D4F9C; --btn-fg:#FFFFFF; --focus:#1D4F9C;
  --good:#17794A; --good-bg:#DCF2E5;
  --warn:#8A5600; --warn-bg:#FBEBC6;
  --bad:#B3261E; --bad-bg:#FCE1DE;
  --l1:#A9C1E8; --l2:#5F8CD0; --l3:#1D4F9C;
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1322; --surface:#131F38; --surface-2:#1B2B4B; --sel:#1B2E57;
    --fg:#E6ECF8; --muted:#9FADC8; --line:#2A3B5F;
    --plaque:#2859B0; --plaque-fg:#FFFFFF; --pick:#7FB0FF;
    --btn:#6FA6F7; --btn-fg:#07122A; --focus:#8DB9FF;
    --good:#6FD39B; --good-bg:#10382A;
    --warn:#F3C86F; --warn-bg:#3A2C0C;
    --bad:#FFA39B; --bad-bg:#44191B;
    --l1:#35558F; --l2:#5A8BDB; --l3:#A2C6FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1322; --surface:#131F38; --surface-2:#1B2B4B; --sel:#1B2E57;
  --fg:#E6ECF8; --muted:#9FADC8; --line:#2A3B5F;
  --plaque:#2859B0; --plaque-fg:#FFFFFF; --pick:#7FB0FF;
  --btn:#6FA6F7; --btn-fg:#07122A; --focus:#8DB9FF;
  --good:#6FD39B; --good-bg:#10382A;
  --warn:#F3C86F; --warn-bg:#3A2C0C;
  --bad:#FFA39B; --bad-bg:#44191B;
  --l1:#35558F; --l2:#5A8BDB; --l3:#A2C6FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:24px}
.hint{color:var(--muted);font-size:14px}

/* street plate */
.plaque{position:relative;background:var(--plaque);color:var(--plaque-fg);border-radius:14px;padding:24px 28px 22px;
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:10px 16px}
.plaque::after{content:"";position:absolute;inset:6px;border:2px solid rgba(255,255,255,.92);border-radius:9px;pointer-events:none}
.plaque-small{grid-column:1/-1;font:600 14px/1 var(--font-display);letter-spacing:.16em;text-transform:uppercase;opacity:.92}
.plaque h1{font:700 clamp(54px,15vw,92px)/.9 var(--font-display);letter-spacing:.01em;text-transform:uppercase}
.plaque-num{font:600 17px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;border:2px solid rgba(255,255,255,.92);border-radius:5px;padding:6px 10px 5px;margin-bottom:6px;white-space:nowrap}
.plaque.small{padding:14px 22px;grid-template-columns:1fr}
.plaque.small h1{font-size:clamp(34px,9vw,48px)}

/* setup */
form{display:grid;gap:26px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;margin-bottom:10px;font:600 15px var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 16px;border:2px solid var(--line);background:var(--surface);border-radius:999px;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip[aria-pressed="true"]{background:var(--plaque);border-color:var(--plaque);color:var(--plaque-fg)}
.chip[aria-pressed="true"]::before{content:"\2713"}
.chip .n{font:500 13px var(--font-mono);opacity:.8}
.switch{display:flex;gap:12px;align-items:center;min-height:44px;margin-top:6px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.switch:disabled{opacity:.5;cursor:not-allowed}
.track{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none}
.knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.switch[aria-checked="true"] .track{background:var(--plaque)}
.switch[aria-checked="true"] .knob{transform:translateX(18px)}
.switch .n{font:500 13px var(--font-mono);color:var(--muted)}
.fmts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.fmt{position:relative;display:block}
.fmt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.fmt-body{display:grid;gap:3px;height:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.fmt-body b{font:700 21px/1.1 var(--font-display);letter-spacing:.02em}
.fmt-body span{color:var(--muted);font-size:14px;line-height:1.35}
.rec{font:600 12px var(--font-display);font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--pick);margin-left:6px}
.fmt input:checked+.fmt-body{border-color:var(--pick);background:var(--sel);box-shadow:inset 0 0 0 1px var(--pick)}
.fmt input:focus-visible+.fmt-body{outline:3px solid var(--focus);outline-offset:2px}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:22px}
.seg{display:flex;flex-wrap:wrap;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg label{position:relative;display:block;flex:1 1 auto}
.seg input{position:absolute;opacity:0;inset:0;margin:0;width:100%;height:100%;cursor:pointer}
.seg span{display:block;padding:10px 14px;min-height:44px;font-weight:700;line-height:1.4;text-align:center;border-right:1px solid var(--line)}
.seg label:last-child span{border-right:0}
.seg input:checked+span{background:var(--plaque);color:var(--plaque-fg)}
.seg input:focus-visible+span{outline:3px solid var(--focus);outline-offset:-3px}
fieldset:disabled .seg{opacity:.45}
fieldset:disabled .seg input{cursor:not-allowed}
.settings .hint{margin-top:8px}
.startbar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;background:var(--bg);border-top:1px solid var(--line)}
.startbar p{font-weight:700}
.btn{min-height:48px;padding:10px 22px;border-radius:10px;border:2px solid transparent;font-weight:700;font-size:17px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--btn);color:var(--btn-fg)}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--pick);text-decoration:underline;font-weight:700;cursor:pointer;min-height:44px;padding:0 4px}

/* progress panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:16px}
.panel h2{font:700 26px/1.1 var(--font-display);letter-spacing:.02em}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.c-new{background:var(--line)} .c-shaky{background:var(--l1)} .c-improving{background:var(--l2)} .c-solid{background:var(--l3)} .c-mastered{background:var(--good)}
.catrows{display:grid;gap:8px}
.catrow{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:12px;align-items:center;font-size:14px}
.catrow .stack{height:10px}
.catrow .n{font:500 13px var(--font-mono);color:var(--muted)}
.fmtrow{display:grid;grid-template-columns:minmax(118px,170px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:14px}
.fmtrow .n{font:500 13px var(--font-mono);color:var(--muted)}
.fmtrow .bar{height:10px}
.worst{display:flex;flex-wrap:wrap;gap:8px}
.worst li{display:inline-flex;gap:10px;align-items:baseline;padding:6px 12px;border-radius:8px;background:var(--surface-2)}
.worst .n{font:500 13px var(--font-mono);color:var(--muted)}
.score-line{font:500 14px var(--font-mono);color:var(--muted)}
.evals{display:grid;gap:12px}
.eval{display:grid;gap:10px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.eval-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.eval-q{font:600 26px/1.1 var(--font-display);overflow-wrap:anywhere}
.eval dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0}
.eval dt{color:var(--muted);font-size:14px}
.eval dd{margin:0;overflow-wrap:anywhere;font-weight:700}
.eval mark{background:var(--fg);color:var(--bg);border-radius:3px;padding:0 2px}
.eval .why{display:grid;gap:6px;font-size:15px}
.eval .why p{margin:0}
.mono{font:400 14px/1.5 var(--font-mono)}
.panel-foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}

/* quiz */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap}
.qtop .btn{min-height:44px;padding:6px 16px}
.count{font:600 19px var(--font-display);letter-spacing:.08em;text-transform:uppercase}
.score{font:500 14px var(--font-mono);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pick);transition:width .25s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:16px}
.qcard:focus{outline:none}
.qmeta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:14px}
.tag{font:600 13px var(--font-display);letter-spacing:.12em;text-transform:uppercase;background:var(--surface-2);padding:4px 9px 3px;border-radius:5px}
.kind{color:var(--muted)}
.pips{margin-left:auto;display:inline-flex;gap:3px}
.pips i{width:14px;height:6px;border-radius:2px;background:var(--line);display:block}
.pips i.on{background:var(--pick)}
.qlabel{color:var(--muted)}
.prompt{font:600 clamp(36px,9vw,56px)/1.05 var(--font-display);overflow-wrap:anywhere;text-wrap:balance}
.sub{color:var(--muted);margin-top:-8px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:12px;align-items:center;text-align:left;min-height:58px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font-size:18px;line-height:1.3;overflow-wrap:anywhere}
.opt kbd{font:500 13px var(--font-mono);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted);flex:none}
.opt:hover:not(:disabled){border-color:var(--pick)}
.opt:disabled{color:var(--fg);cursor:default}
.opt.is-right{border-color:var(--good);background:var(--good-bg)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.6}
.st{margin-left:auto;font:600 13px var(--font-display);letter-spacing:.1em;text-transform:uppercase;flex:none;padding-left:8px}
.field{width:100%;min-height:58px;padding:10px 14px;font:500 24px var(--font-body);color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:12px}
.field.is-ok{border-color:var(--good)} .field.is-bad{border-color:var(--bad)} .field.is-warn{border-color:var(--warn)}
.conjrow{display:flex;gap:12px;align-items:center}
.pron{font:600 34px var(--font-display);flex:none}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{min-width:42px;height:42px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;font:500 18px var(--font-mono);cursor:pointer}
.line{display:flex;flex-wrap:wrap;gap:8px;min-height:68px;padding:10px 4px;border-bottom:3px dashed var(--line);align-items:center}
.line:empty::before{content:"Tap words below to build the answer";color:var(--muted);font-size:15px;padding-left:6px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tile{min-height:46px;padding:8px 16px;border:2px solid var(--line);background:var(--surface-2);border-radius:10px;font-size:20px;cursor:pointer}
.line .tile{background:var(--sel);border-color:var(--pick)}
.tile:disabled{cursor:default;color:var(--fg)}
.line.is-ok{border-bottom-color:var(--good)} .line.is-bad{border-bottom-color:var(--bad)}
.cells{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
.cell{min-width:36px;height:60px;padding:0 4px;border:2px dashed var(--pick);background:var(--sel);border-radius:8px;font:500 28px var(--font-mono);cursor:pointer;color:var(--fg)}
.cell.changed{border-style:solid}
.cell:disabled{color:var(--fg);cursor:default}
.cell.good{border-style:solid;border-color:var(--good);background:var(--good-bg)}
.cell.bad{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.fixed{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:60px;font:500 28px var(--font-mono)}
.gap{width:16px}
.arts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.art{min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 36px/1 var(--font-display);border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.art kbd{font:500 12px var(--font-mono);color:var(--muted)}
.art:hover:not(:disabled){border-color:var(--pick)}
.art:disabled{color:var(--fg);cursor:default}
.art.is-right{border-color:var(--good);background:var(--good-bg)} .art.is-wrong{border-color:var(--bad);background:var(--bad-bg)} .art.dim{opacity:.6}
.fb{display:grid;gap:6px;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2)}
.fb.ok{background:var(--good-bg);border-color:var(--good)}
.fb.warn{background:var(--warn-bg);border-color:var(--warn)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{font:700 22px/1.1 var(--font-display);letter-spacing:.04em;text-transform:uppercase}
.fb.ok h3{color:var(--good)} .fb.warn h3{color:var(--warn)} .fb.bad h3{color:var(--bad)}
.fb .ans{font-size:22px;font-weight:700}
.fb .pair,.fb .note{font-size:15px}
.fb .row{font:400 14px/1.5 var(--font-mono);overflow-wrap:anywhere}
.fb mark{background:var(--fg);color:var(--bg);border-radius:3px;padding:0 2px}
.qactions{display:flex;gap:10px;flex-wrap:wrap}
.qactions .btn{min-width:150px}
.qfoot{display:flex;justify-content:center}

/* summary */
.result{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.big{font:700 clamp(76px,22vw,132px)/.9 var(--font-display)}
.of{font:600 clamp(30px,8vw,48px)/1 var(--font-display);color:var(--muted)}
.pct{font:600 clamp(30px,8vw,48px)/1 var(--font-display);margin-left:auto}
.work{display:grid;gap:10px}
.work li{display:grid;gap:2px;padding:10px 14px;border-radius:10px;background:var(--surface-2)}
.work b{font-weight:700}
.work span{color:var(--muted);font-size:15px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font:600 14px var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 10px 6px 0;border-bottom:2px solid var(--line)}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.actions{display:flex;flex-wrap:wrap;gap:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  KIND_ERR[kind].forEach(t=>{const v=et[t]||0;if(v>topV){topV=v;top=t;}});
  if(topV>=0.8)return 'Focus: '+ERRLABEL[top][0];
  const ks=Object.keys(DIFF);const mean=ks.reduce((t,k)=>t+bOf(k),0)/ks.length;

    if(it&&S.pool.includes(it)){

      const other=ks.filter(k=>k!==r.kind);if(other.length)ks=other;
      if(ks.length){const kind=wpick(ks,ks.map(k=>pairWeight(it,k)));return {item:it,kind:kind,why:S.fmt==='adaptive'?'Missed earlier, trying again another way':''};}
    }

  const same=shuffle(ok.filter(x=>x.cat===it.cat)),other=shuffle(ok.filter(x=>x.cat!==it.cat));
  const chosen=[];const seen=new Set([val(it)]);
  for(const x of same.concat(other)){if(chosen.length>=3)break;const v=val(x);if(seen.has(v))continue;seen.add(v);chosen.push(x);}
  return shuffle([it].concat(chosen)).map(x=>({text:val(x),correct:x.id===it.id}));
}
function buildData(q){
  const it=q.item;
  if(q.kind==='mc_fe')q.opts=mcOptions(it,'fe');
  else if(q.kind==='mc_ef')q.opts=mcOptions(it,'ef');
  else if(q.kind==='tiles'){
    const own=new Set(it.tokens.map(t=>t.toLowerCase()));
    let pool=[];ITEMS.filter(x=>x.cat===it.cat&&x.id!==it.id).forEach(x=>x.tokens.forEach(t=>{const l=t.toLowerCase();if(!own.has(l)&&!pool.includes(l))pool.push(l);}));
    pool=shuffle(pool);
    const want=it.tokens.length<=3?3:2;const dis=[];
    if(it.art){const alt=shuffle(['le','la',"l'"].filter(a=>a!==it.art&&!own.has(a)))[0];if(alt)dis.push(alt);}
    pool.forEach(t=>{if(dis.length<want&&!dis.includes(t))dis.push(t);});
    q.bank=shuffle(it.tokens.map(t=>t.toLowerCase()).concat(dis)).map((t,i)=>({id:i,text:t}));
    q.line=[];
  }
  else if(q.kind==='accent'){
    q.cells=Array.from(it.core).map(ch=>{
      if(ch===' ')return {gap:true,ch:' '};
      const lower=ch.toLowerCase();const base=strip(lower);
      const vars=VAR[base];
      if(vars){const up=ch!==lower;const list=vars.map(v=>up?v.toUpperCase():v);return {vars:list,idx:0,exp:ch,ch:list[0]};}
      return {fixed:true,ch:ch,exp:ch};
    });
  }
}

/* ---------- grading ---------- */
function gradeFr(inp,expected,it){
  const u=normFr(inp),exp=expected.map(normFr),us=strip(u);
  if(exp.includes(u))return {r:'ok'};
  if(exp.some(e=>strip(e)===us))return {r:'accent'};
  if(it&&it.art){
    const m=u.match(/^(le |la |l'|les |un |une )\s*(.*)$/);
    const un=m?m[2]:u;
    if(strip(un)===strip(normFr(it.noun)))return {r:'article',missing:!m};
  }
  let best=99;exp.forEach(e=>{best=Math.min(best,lev(strip(e),us));});
  const L=Math.max.apply(null,exp.map(e=>e.length));
  if(best<=1||(best<=2&&L>=9))return {r:'close'};
  return {r:'wrong'};
}
function hlAccents(exp,typed){
  const e=exp.normalize('NFC'),t=typed.normalize('NFC').replace(/[.…]+/g,'').trim().toLowerCase();
  if(e.length!==t.length)return esc(e);
  let out='';for(let i=0;i<e.length;i++){out+=e[i].toLowerCase()!==t[i]?'<mark>'+esc(e[i])+'</mark>':esc(e[i]);}
  return out;
}
const pairHtml=it=>`<p class="pair"><span lang="fr">${esc(it.fr)}</span> · <span lang="en">${esc(it.en)}</span></p>`;
const alsoHtml=it=>{const a=(it.alts||[]).filter(x=>!it.accepted.has(normEn(x))||true).slice(0,4);return a.length?`<p class="note">Also accepted: ${esc(a.join(', '))}</p>`:'';};
const mineHtml=s=>s?`<p class="note">You wrote: <span>${esc(s)}</span></p>`:'';
function genderMsg(it){
  const g=it.g==='m'?'masculine':'feminine';
  return it.art==="l'"?`${it.noun} is ${g}, but it starts with a vowel or a silent h, so the article becomes l'.`:`${it.noun} is ${g}, so it takes ${it.art}.`;
}
function R(state,title,html,points,errType,mine){return {state:state,title:title,html:html,points:points,errType:errType||'',mine:mine||''};}
function gradeMC(q,i){
  q.chosen=i;const o=q.opts[i];const right=q.opts.find(x=>x.correct);
  if(o.correct)return R('ok','Correct',pairHtml(q.item),1,'',o.text);
  return R('bad','Not quite',`<p class="note">You chose: ${esc(o.text)}</p>${pairHtml(q.item)}`,0,'vocab',o.text);
}
/* English spelling is not what is being tested, so typos are forgiven: letters swapped, dropped, added or
   doubled, and a missing or extra space. Short words must be exact (he and she are different answers) and an
   answer that exactly matches a different word's translation is never forgiven. */
function osa(a,b){
  const m=a.length,n=b.length,d=[];
  for(let i=0;i<=m;i++)d[i]=[i];
  for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
  }
  return d[m][n];
}
function tokenClose(t,a){
  if(t===a)return true;
  const L=Math.max(t.length,a.length);
  if(L<=3||Math.abs(t.length-a.length)>2)return false;
  if(L===4)return t[0]===a[0]&&osa(t,a)===1;
  return osa(t,a)<=(L>=8?2:1);
}
function fuzzyEn(u,it){
  if(!u)return false;
  if(ITEMS.some(x=>x.id!==it.id&&x.accepted.has(u)&&!it.accepted.has(u)))return false;
  const ut=u.split(' ');
  for(const a of it.accepted){
    const at=a.split(' ');
    if(at.length===ut.length&&at.every((x,i)=>tokenClose(ut[i],x)))return true;
    const uj=u.replace(/ /g,''),aj=a.replace(/ /g,'');
    if(uj===aj)return true;
    if(aj.length>=8&&osa(uj,aj)<=(aj.length>=10?2:1)&&at.length!==ut.length)return true;
  }
  return false;
}
function gradeTypeFe(q,inp){
  const it=q.item,u=normEn(inp);
  if(it.accepted.has(u))return R('ok','Correct',pairHtml(it)+alsoHtml(it),1,'',inp);
  if(fuzzyEn(u,it))return R('ok','Correct',`<p class="note">Counted as correct. Standard spelling: <b lang="en">${esc(it.en)}</b></p>${pairHtml(it)}`,1,'',inp);
  let best=99;it.accepted.forEach(a=>{if(a.length>=5)best=Math.min(best,lev(a,u));});
  const close=best<=1||(best<=2&&u.length>=12);
  return R('bad',close?'Close. Check the spelling':'Not quite',`<p class="ans" lang="en">${esc(it.en)}</p>${alsoHtml(it)}${mineHtml(inp)}<p class="pair" lang="fr">${esc(it.fr)}</p>`,0,close?'spelling':'vocab',inp);
}
function gradeTypeEf(q,inp){
  const it=q.item;const g=gradeFr(inp,[it.core],it);
  const ans=`<p class="ans" lang="fr">${esc(it.core)}</p>`;
  if(g.r==='ok')return R('ok','Correct',pairHtml(it),1,'',inp);
  if(g.r==='accent'){
    const pts=S.acc==='warn'?1:0;
    return R('warn',pts?'Right, but watch the accents':'Right word, accents missing',`<p class="ans" lang="fr">${hlAccents(it.core,inp)}</p>${mineHtml(inp)}${pairHtml(it)}`,pts,'accent',inp);
  }
  if(g.r==='article')return R('bad','Check the article',`<p class="note">${esc(g.missing?'Include the article.':'Right noun, wrong article.')} ${esc(genderMsg(it))}</p>${ans}${mineHtml(inp)}${pairHtml(it)}`,0,'article',inp);
  return R('bad',g.r==='close'?'Close. Check the spelling':'Not quite',`${ans}${mineHtml(inp)}${pairHtml(it)}`,0,g.r==='close'?'spelling':'vocab',inp);
}
function gradeConj(q,inp){
  const it=q.item,v=it.verb;const g=gradeFr(inp,[v.form,it.core],null);
  const full=`<p class="ans" lang="fr">${esc(it.fr)}</p><p class="row" lang="fr">${esc(v.inf)}: ${esc(v.row)}</p>`;
  if(g.r==='ok')return R('ok','Correct',`<p class="pair"><span lang="fr">${esc(it.fr)}</span> · ${esc(it.en)}</p>`,1,'',inp);
  return R('bad',g.r==='close'?'Close. Check the ending':'Not quite',`${full}${mineHtml(inp)}`,0,'ending',inp);
}
function gradeTiles(q){
  const it=q.item;
  const words=q.line.map(id=>q.bank.find(b=>b.id===id).text);
  const built=joinTokens(words);
  if(normFr(built)===normFr(it.core))return R('ok','Correct',pairHtml(it),1,'',built);
  const exp=it.tokens.map(t=>t.toLowerCase());
  let type='order',title='Not quite';
  if(words.length===exp.length){
    const diff=[];words.forEach((w,i)=>{if(w!==exp[i])diff.push(i);});
    if(diff.length===1&&['le','la',"l'"].includes(words[diff[0]])&&['le','la',"l'"].includes(exp[diff[0]])){type='article';title='Check the article';}
  }
  const extra=type==='article'&&it.art?`<p class="note">${esc(genderMsg(it))}</p>`:'';
  return R('bad',title,`${extra}<p class="ans" lang="fr">${esc(it.core)}</p><p class="note">You built: ${esc(built)}</p>${pairHtml(it)}`,0,type,built);
}
function gradeAccent(q){
  const it=q.item;const cur=q.cells.map(c=>c.ch).join('');
  if(normFr(cur)===normFr(it.core))return R('ok','Correct',pairHtml(it),1,'',cur);
  const bad=q.cells.filter(c=>c.vars&&c.ch!==c.exp).length+q.cells.filter(c=>c.vars&&c.ch===c.exp&&c.exp!==c.vars[0]).length;
  return R('bad','Check the accents',`<p class="ans" lang="fr">${hlAccents(it.core,cur)}</p><p class="note">You made: ${esc(cur)}</p>${pairHtml(it)}`,0,'accent',cur);
}
function gradeArticle(q,a){
  const it=q.item;q.chosenArt=a;
  if(a===it.art)return R('ok','Correct',`<p class="pair"><span lang="fr">${esc(it.fr)}</span> · ${esc(it.en)}</p><p class="note">${esc(genderMsg(it))}</p>`,1,'',a);
  return R('bad','Not quite',`<p class="ans" lang="fr">${esc(it.fr)}</p><p class="note">${esc(genderMsg(it))}</p><p class="note">You chose: ${esc(a)}</p>`,0,'article',a);
}

/* ---------- recording and reveal ---------- */
function record(q,res){
  /* nudge the word score and the format difficulty by how surprising the answer was (partial credit for accents) */
  const s=store.items[q.item.id]||(store.items[q.item.id]={n:0,ok:0,bad:0,a:0,last:'',lastErr:''});
  const y=res.state==='ok'?1:(res.state==='warn'?(res.points>=1?0.7:0.3):0);
  const err=y-pOf(q.item,q.kind);
  s.a=clamp((s.a||0)+0.9*err,-3.5,3.5);
  if(!store.bk)store.bk={};
  store.bk[q.kind]=clamp(bOf(q.kind)+0.12*err,-2.5,2.5);
  s.n=(s.n||0)+1;
  if(res.points>=1)s.ok=(s.ok||0)+1;else s.bad=(s.bad||0)+1;
  s.last=res.state==='ok'?'ok':(res.state==='warn'?'acc':'bad');
  s.lastErr=res.errType||'';
  /* per-format recent results and decaying mistake-type counts drive the adaptive choice */
  const h=store.sk[q.kind]||(store.sk[q.kind]=[]);h.push(res.points>=1?1:0);if(h.length>8)h.shift();
  Object.keys(store.et).forEach(t=>{store.et[t]*=0.9;if(store.et[t]<0.05)delete store.et[t];});
  if(res.errType)store.et[res.errType]=(store.et[res.errType]||0)+1;
}
function reveal(res){
  const q=S.q;if(S.answered)return;
  S.answered=true;
  const before=Math.round(wordScore(q.item)*100);
  record(q,res);
  res.html+=`<p class="score-line">Word score ${before} → ${Math.round(wordScore(q.item)*100)}</p>`;
  S.n++;S.points+=res.points;
  const c=S.byCat[q.item.cat]||(S.byCat[q.item.cat]={asked:0,ok:0});c.asked++;c.ok+=res.points;
  if(res.errType)S.errs[res.errType]=(S.errs[res.errType]||0)+1;
  if(res.points<1||res.errType)S.log.push({item:q.item,kind:q.kind,errType:res.errType||'vocab',mine:res.mine||'',points:res.points});
  if(res.points<1){S.missed[q.item.id]={item:q.item,mine:res.mine};S.retry.push({id:q.item.id,kind:q.kind,due:S.n+3});}
  lockUI(q,res);
  const fb=$('#fb');fb.className='fb '+res.state;fb.innerHTML=`<h3>${esc(res.title)}</h3>${res.html}`;fb.hidden=false;
  const last=S.total!==Infinity&&S.n>=S.total;
  $('#qactions').innerHTML=`<button type="button" class="btn btn-primary" data-action="next" id="nextBtn">${last?'See results':'Next'}</button>`;
  $('#nextBtn').focus();
  updateHeader();save();
}
function lockUI(q,res){
  const k=q.kind;
  if(k==='mc_fe'||k==='mc_ef'){
    $$('.opt').forEach((b,i)=>{b.disabled=true;const o=q.opts[i];
      if(o.correct){b.classList.add('is-right');b.insertAdjacentHTML('beforeend','<span class="st">Correct</span>');}
      else if(i===q.chosen){b.classList.add('is-wrong');b.insertAdjacentHTML('beforeend','<span class="st">Your answer</span>');}
      else b.classList.add('dim');});
  }else if(k==='article'){
    $$('.art').forEach(b=>{b.disabled=true;const a=b.dataset.art;
      if(a===q.item.art)b.classList.add('is-right');else if(a===q.chosenArt)b.classList.add('is-wrong');else b.classList.add('dim');});
  }else if(k==='type_fe'||k==='type_ef'||k==='conj'){
    const i=$('#ans');i.readOnly=true;i.classList.add(res.state==='ok'?'is-ok':(res.state==='warn'?'is-warn':'is-bad'));
    $$('.keys').forEach(x=>{x.hidden=true;});
  }else if(k==='tiles'){
    $$('.tile').forEach(b=>{b.disabled=true;});$('#line').classList.add(res.state==='ok'?'is-ok':'is-bad');
    $('#bank').hidden=true;
  }else if(k==='accent'){
    q.cells.forEach((c,i)=>{if(!c.vars)return;const b=$(`[data-i="${i}"]`);if(!b)return;b.disabled=true;b.classList.remove('changed');b.classList.add(c.ch===c.exp?'good':'bad');});
  }
}
function onCheck(){
  if(!S||S.answered)return;
  const q=S.q;let res=null;
  if(q.kind==='type_fe'||q.kind==='type_ef'||q.kind==='conj'){
    const v=$('#ans').value;if(!v.trim()){$('#ans').focus();return;}
    res=q.kind==='type_fe'?gradeTypeFe(q,v):(q.kind==='type_ef'?gradeTypeEf(q,v):gradeConj(q,v));
  }else if(q.kind==='tiles'){
    if(!q.line.length)return;res=gradeTiles(q);
  }else if(q.kind==='accent'){
    res=gradeAccent(q);
  }
  if(res)reveal(res);
}

/* ---------- evaluation of the wrong answers ---------- */
const ACCENT_TIPS={
 'é':'é sounds like "ay" and is the most common accent.',
 'è':'è is an open sound, usually before a consonant and a silent e, as in bibliothèque and routière.',
 'ê':'The circumflex (ê, â, ô, î, û) often marks a lost s: hôpital, hôtel, pâtisserie, théâtre, église.',
 'â':'The circumflex (ê, â, ô, î, û) often marks a lost s: hôpital, hôtel, pâtisserie, théâtre, église.',
 'ô':'The circumflex (ê, â, ô, î, û) often marks a lost s: hôpital, hôtel, pâtisserie, théâtre, église.',
 'î':'The circumflex (ê, â, ô, î, û) often marks a lost s: hôpital, hôtel, pâtisserie, théâtre, église.',
 'û':'The circumflex (ê, â, ô, î, û) often marks a lost s: hôpital, hôtel, pâtisserie, théâtre, église.',
 'ç':'ç makes a soft s sound before a, o or u.',
 'à':'à means "to" or "at" and always keeps its accent, unlike a, which means "has".'
};
const VERB_NOTE={
 aller:'aller is irregular, so learn it as a block. il, elle and on all take va; ils and elles take vont.',
 voir:'voir changes in the plural: voyons, voyez, voient. je and tu both take vois; il, elle and on take voit.',
 sortir:'sortir drops its t in the singular (sors, sors, sort) and gets it back in the plural (sortons, sortez, sortent).'
};
const TIPS={
 "la librairie":"False friend: la librairie is a bookshop. The library is la bibliothèque.",
 "la bibliothèque":"A bibliothèque is a library. A bookshop is la librairie.",
 "l'hôtel de ville":"Not a hotel. l'hôtel de ville is the town hall.",
 "la gare":"la gare is the train station. The bus station is la gare routière.",
 "la gare routière":"routière comes from route, so la gare routière is the bus station.",
 "la boulangerie":"The -erie ending marks a shop: la boulangerie (bread), la pâtisserie (cakes), la boucherie (meat).",
 "la pâtisserie":"The -erie ending marks a shop: la pâtisserie sells cakes and pastries.",
 "la boucherie":"The -erie ending marks a shop: la boucherie is the butcher's.",
 "l'épicerie":"l'épicerie is the small grocer's. The big shop is le supermarché.",
 "le supermarché":"le supermarché is the big shop. The small grocer's is l'épicerie.",
 "la poste":"la poste is the post office. Tobacco and stamps are also sold at le bureau de tabac.",
 "le bureau de tabac":"le bureau de tabac is the tobacconist, a different place from la poste.",
 "le coiffeur":"le coiffeur is a male hairdresser; la coiffeuse is a female one.",
 "la coiffeuse":"la coiffeuse is a female hairdresser; le coiffeur is a male one.",
 "la gendarmerie":"In France la gendarmerie is the police station.",
 "la caserne des pompiers":"les pompiers are the firefighters, so la caserne des pompiers is the fire station.",
 "les feux":"les feux is plural, the traffic lights, so it takes les.",
 "le rond-point":"le rond-point is the roundabout: rond is round.",
 "le carrefour":"le carrefour is the crossroads or junction.",
 "Tournez à gauche":"Tournez means turn. Prenez means take. gauche is left and droite is right.",
 "Tournez à droite":"Tournez means turn. Prenez means take. droite is right and gauche is left.",
 "Prenez la première rue":"Prenez means take. première (first) and deuxième (second) both carry accents.",
 "Prenez la deuxième rue":"Prenez means take. première (first) and deuxième (second) both carry accents.",
 "Continuez tout droit":"Continuez means continue and tout droit means straight on.",
 "Continuez jusqu'à ...":"jusqu'à means until or as far as, and the à keeps its accent.",
 "l'office du tourisme":"l'office du tourisme is the tourist office. office starts with a vowel, so it takes l'.",
 "l'hôpital":"l'hôpital has a circumflex, and the silent h means it takes l'.",
 "la fromagerie":"fromage is cheese, so la fromagerie is the cheese shop.",
 "la poissonnerie":"poisson is fish, so la poissonnerie is the fishmonger's.",
 "la charcuterie":"la charcuterie sells cooked pork meats, like a deli.",
 "la confiserie":"la confiserie is a sweet shop.",
 "la papeterie":"papier is paper, so la papeterie is the stationery shop.",
 "le fleuriste":"fleur is flower, so le fleuriste is the florist."
};
/* mark the letters of the correct answer that the learner's answer is missing or got wrong */
function diffMark(c,t){
  const a=c.toLowerCase(),b=t.toLowerCase().replace(/[.…]+/g,'').trim(),m=a.length,n=b.length;
  const L=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  let i=0,j=0,out='';
  while(i<m){
    if(j<n&&a[i]===b[j]){out+=esc(c[i]);i++;j++;}
    else if(j<n&&L[i][j+1]>=L[i+1][j]){j++;}
    else{out+='<mark>'+esc(c[i])+'</mark>';i++;}
  }
  return out;
}
function askedOf(e){
  const it=e.item,k=e.kind;
  if(k==='mc_fe'||k==='type_fe')return {text:it.fr,lang:'fr'};
  if(k==='article')return {text:`${it.noun} (${it.en})`,lang:'fr'};
  if(k==='conj')return {text:`${it.verb.pron} … (${it.verb.inf})`,lang:'fr'};
  return {text:it.en,lang:'en'};
}
function correctOf(e){
  const k=e.kind,it=e.item;
  if(k==='mc_fe'||k==='type_fe')return it.en;
  if(k==='type_ef'||k==='accent'||k==='tiles')return it.core;
  return it.fr;
}
/* did the learner give a real answer that belongs to a different word? */
function confusedWith(e){
  const m=e.mine,it=e.item,k=e.kind;
  if(!m)return null;
  if(k==='mc_fe')return ITEMS.find(x=>x.en===m&&x.id!==it.id)||null;
  if(k==='mc_ef')return ITEMS.find(x=>x.fr===m&&x.id!==it.id)||null;
  if(k==='type_fe'){const u=normEn(m);return ITEMS.find(x=>x.id!==it.id&&x.accepted.has(u)&&!it.accepted.has(u))||null;}
  if(k==='type_ef'){const u=normFr(m);return ITEMS.find(x=>x.id!==it.id&&normFr(x.core)===u)||null;}
  if(k==='conj'){const u=normFr(m);return ITEMS.find(x=>x.id!==it.id&&x.verb&&it.verb&&x.verb.key===it.verb.key&&(normFr(x.verb.form)===u||normFr(x.core)===u))||null;}
  return null;
}
function whyHtml(e){
  const it=e.item,k=e.kind,t=e.errType,conf=confusedWith(e),out=[];
  const b=s=>`<b lang="fr">${esc(s)}</b>`;
  if(t==='accent'){
    const ws=it.core.split(' ').filter(w=>strip(w)!==w);
    out.push(`Accents are part of the spelling in French, so a missing or wrong accent is a mistake. Watch ${ws.map(b).join(', ')}.`);
    const tips=[];Array.from(it.core.toLowerCase()).forEach(c=>{if(ACCENT_TIPS[c]&&!tips.includes(ACCENT_TIPS[c]))tips.push(ACCENT_TIPS[c]);});
    tips.forEach(x=>out.push(esc(x)));
  }else if(t==='article'){
    out.push(esc(it.art?genderMsg(it):'Check which article goes with the noun.'));
    out.push(`Learn each noun with its article as one chunk, for example ${b(it.fr)}.`);
  }else if(t==='ending'){
    const v=it.verb;
    out.push(`With <b lang="fr">${esc(v.pron)}</b>, ${esc(v.inf)} becomes ${b(v.form)}.`);
    if(conf&&conf.verb)out.push(`What you wrote is the form for <b lang="fr">${esc(conf.verb.pron)}</b>.`);
    out.push(esc(VERB_NOTE[v.key]));
    out.push(`<span class="mono" lang="fr">${esc(v.row)}</span>`);
  }else if(t==='order'){
    out.push(`The words are in the wrong order, or one of them is wrong. The correct phrase is ${b(it.core)}.`);
    out.push('Directions follow the pattern verb, article, noun, as in Prenez la deuxième rue.');
  }else if(t==='spelling'){
    out.push('Right idea, but the spelling is off. The highlighted letters are the ones you missed or changed.');
  }else{
    if(conf){
      if(k==='mc_fe'||k==='type_fe')out.push(`You gave the meaning of ${b(conf.fr)}. ${b(it.fr)} means <b lang="en">${esc(it.en)}</b>.`);
      else out.push(`You gave ${b(e.mine)}, which means <b lang="en">${esc(conf.en)}</b>. The French for <b lang="en">${esc(it.en)}</b> is ${b(it.fr)}.`);
    }else out.push(`You did not recall this one. ${b(it.fr)} means <b lang="en">${esc(it.en)}</b>.`);
  }
  if(t!=='ending'&&TIPS[it.fr])out.push(esc(TIPS[it.fr]));
  return out.map(x=>`<p>${x}</p>`).join('');
}
function evalCard(e){
  const it=e.item,k=e.kind,a=askedOf(e);
  const fl=(k==='mc_fe'||k==='type_fe')?'en':'fr';
  const label=(k==='mc_fe'||k==='mc_ef'||k==='article')?'You chose':(k==='tiles'?'You built':'You wrote');
  const diffable=['type_ef','accent','tiles'].includes(k)&&e.mine&&['accent','spelling','order'].includes(e.errType);
  const corr=diffable?diffMark(it.core,e.mine):esc(correctOf(e));
  return `<li class="eval"><div class="eval-head"><span class="tag">${esc(KINDSHORT[k])}</span><span class="eval-q" lang="${a.lang}">${esc(a.text)}</span>${e.count>1?`<span class="hint">missed ${e.count} times</span>`:''}${e.points>=1?'<span class="hint">accepted in Forgiving mode</span>':''}</div>
    <dl><dt>${label}</dt><dd lang="${fl}">${esc(e.mine||'(no answer)')}</dd><dt>Correct</dt><dd lang="${fl}">${corr}</dd></dl>
    <div class="why">${whyHtml(e)}</div></li>`;
}
function evaluationHtml(){
  const seen={},rows=[];
  S.log.forEach(e=>{
    const key=e.item.id+'|'+e.kind;
    if(seen[key]){seen[key].count++;seen[key].mine=e.mine;seen[key].errType=e.errType;seen[key].points=e.points;}
    else{seen[key]=Object.assign({count:1},e);rows.push(seen[key]);}
  });
  if(!rows.length)return '';
  const top=Object.keys(S.errs).filter(x=>ERRLABEL[x]).sort((a,b)=>S.errs[b]-S.errs[a])[0];
  const lead=top?`<p>Most of your slips were <b>${esc(ERRLABEL[top][0].toLowerCase())}</b> (${S.errs[top]} of ${S.log.length}). ${esc(ERRLABEL[top][1])}</p>`:'';
  return `<section class="panel"><h2>Evaluation</h2><p class="hint">Every answer you missed, and why it was wrong.</p>${lead}<ul class="evals">${rows.map(evalCard).join('')}</ul></section>`;
}

/* ---------- summary ---------- */
function fmtTime(ms){const s=Math.round(ms/1000);return s<60?s+' s':Math.floor(s/60)+' min '+(s%60)+' s';}
function showSummary(){
  view='summary';
  const n=S.n,pts=S.points,pct=n?Math.round(pts/n*100):0;
  if(n){store.last={pts:pts,n:n,date:Date.now()};save();}
  const msg=pct>=90?'Very solid. Run it again in Type the answer to be sure of spelling and accents.':(pct>=70?'Good base. The words below need another pass.':'Keep going. The words you missed will come back first in your next test.');
  const errs=Object.keys(S.errs).filter(k=>S.errs[k]>0&&ERRLABEL[k]).sort((a,b)=>S.errs[b]-S.errs[a]);
  const work=errs.length?`<ul class="work">${errs.map(k=>`<li><b>${ERRLABEL[k][0]} · ${S.errs[k]}</b><span>${esc(ERRLABEL[k][1])}</span></li>`).join('')}</ul>`:'<p>No mistakes this round.</p>';
  const cats=Object.keys(S.byCat).map(c=>{const b=S.byCat[c];const p=Math.round(b.ok/b.asked*100);
    return `<div class="catrow"><span>${esc(CATLABEL[c])}</span><div class="bar" aria-hidden="true"><i style="width:${p}%"></i></div><span class="n">${b.ok}/${b.asked}</span></div>`;}).join('');
  const missed=Object.keys(S.missed).map(id=>S.missed[id]);
  const evaluation=evaluationHtml();
  app.innerHTML=`<div class="wrap">
    <header class="plaque small"><h1>Résultat</h1></header>
    <section class="panel">
      <div class="result"><span class="big">${pts}</span><span class="of">of ${n}</span><span class="pct">${pct}%</span></div>
      <p>${esc(msg)} <span class="hint">${fmtTime(Date.now()-S.t0)}</span></p>
    </section>
    <section class="panel"><h2>What to work on</h2>${work}</section>
    ${cats?`<section class="panel"><h2>By list</h2><div class="catrows">${cats}</div></section>`:''}
    ${evaluation}
    <div class="actions">
      ${missed.length?'<button type="button" class="btn btn-primary" data-action="practiceMissed">Practise missed words</button>':'<button type="button" class="btn btn-primary" data-action="again">Test again</button>'}
      <button type="button" class="btn btn-ghost" data-action="setup">Back to setup</button>
    </div>
  </div>`;
  window.scrollTo(0,0);
}

/* ---------- events ---------- */
app.addEventListener('mousedown',e=>{if(e.target.closest('.key'))e.preventDefault();});
app.addEventListener('change',e=>{
  if(view!=='setup')return;
  const t=e.target;
  if(t.name==='fmt')cfg.fmt=t.value;else if(t.name==='dir')cfg.dir=t.value;else if(t.name==='len')cfg.len=+t.value;else if(t.name==='acc')cfg.acc=t.value;else return;
  refreshSetup();
});
app.addEventListener('keydown',e=>{
  if(e.target.id==='ans'&&e.key==='Enter'){e.preventDefault();onCheck();}
});
document.addEventListener('keydown',e=>{
  if(view!=='quiz'||!S||!S.q)return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA')return;
  if(!S.answered&&/^[1-4]$/.test(e.key)){
    const b=$(`[data-opt="${+e.key-1}"]`)||$$('.art')[+e.key-1];
    if(b){e.preventDefault();b.click();}
  }else if(S.answered&&e.key==='Enter'&&tag!=='BUTTON'){
    const b=$('#nextBtn');if(b){e.preventDefault();b.click();}
  }
});
let resetTimer=null;
app.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const a=t.dataset.action;if(!a)return;
  if(a==='chip'){
    const c=t.dataset.cat;cfg.cats=cfg.cats.includes(c)?cfg.cats.filter(x=>x!==c):cfg.cats.concat([c]);refreshSetup();
  }else if(a==='weak'){cfg.weak=!cfg.weak;refreshSetup();}
  else if(a==='start'){startSession();}
  else if(a==='reset'){
    if(t.dataset.armed){clearTimeout(resetTimer);store.items={};store.last=null;store.sk={};store.et={};save();renderSetup();}
    else{t.dataset.armed='1';t.textContent='Tap again to erase all progress';resetTimer=setTimeout(()=>{t.dataset.armed='';t.textContent='Reset progress';},4000);}
  }
  else if(a==='quit'||a==='setup'){renderSetup();}
  else if(a==='finish'){if(S&&S.n>0)showSummary();else renderSetup();}
  else if(a==='again'){startSession();}
  else if(a==='practiceMissed'){
    const pool=Object.keys(S.missed).map(id=>S.missed[id].item);
    startSession({pool:pool,fmt:'adaptive',dir:'mix',len:Math.max(10,pool.length*2)});
  }
  else if(a==='opt'){if(S&&!S.answered)reveal(gradeMC(S.q,+t.dataset.opt));}
  else if(a==='art'){if(S&&!S.answered)reveal(gradeArticle(S.q,t.dataset.art));}
  else if(a==='check'){onCheck();}
  else if(a==='next'){
    if(S.total!==Infinity&&S.n>=S.total)showSummary();else nextQuestion();
  }
  else if(a==='key'){
    const i=$('#ans');if(!i||i.readOnly)return;
    const s=i.selectionStart==null?i.value.length:i.selectionStart,en=i.selectionEnd==null?s:i.selectionEnd;
    i.value=i.value.slice(0,s)+t.dataset.ch+i.value.slice(en);i.setSelectionRange(s+1,s+1);i.focus();
  }
  else if(a==='tile'){
    const q=S.q;if(S.answered)return;const id=+t.dataset.id;
    const k=q.line.indexOf(id);if(k>=0)q.line.splice(k,1);else q.line.push(id);
    paintTiles();
  }
  else if(a==='clear'){if(S&&!S.answered){S.q.line=[];paintTiles();}}
  else if(a==='cell'){
    const q=S.q;if(S.answered)return;const c=q.cells[+t.dataset.i];
    c.idx=(c.idx+1)%c.vars.length;c.ch=c.vars[c.idx];
    t.textContent=c.ch;t.classList.toggle('changed',c.idx>0);t.setAttribute('aria-label',c.ch+', tap to change accent');
  }
});

renderSetup();
})();
</script>

</body></html>
